<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Niche Magazine Splash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }

      #root {
        height: 100%;
      }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;

      const NicheMagazineSplash = () => {
        const [opacity, setOpacity] = useState(0);

        useEffect(() => {
          const id = setTimeout(() => setOpacity(1), 100);
          return () => clearTimeout(id);
        }, []);

        return (
          <div className="w-full h-screen bg-black flex items-center justify-center overflow-hidden relative">
            <style>{`
              .font-display {
                font-family: 'Cormorant Garamond', serif;
                letter-spacing: 0.15em;
              }

              .font-sans {
                font-family: 'Inter', sans-serif;
                letter-spacing: 0.25em;
              }

              @keyframes shimmer {
                0% {
                  background-position: -200% center;
                }
                100% {
                  background-position: 200% center;
                }
              }

              .shimmer-text {
                background: linear-gradient(
                  90deg,
                  #D4AF37 0%,
                  #F4E5B0 25%,
                  #FFD700 50%,
                  #F4E5B0 75%,
                  #D4AF37 100%
                );
                background-size: 200% auto;
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: shimmer 3s linear infinite;
              }

              @keyframes glow {
                0%, 100% {
                  opacity: 0.4;
                  transform: scale(1);
                }
                50% {
                  opacity: 0.8;
                  transform: scale(1.1);
                }
              }

              .glow-effect {
                animation: glow 3s ease-in-out infinite;
              }

              @keyframes fadeIn {
                from {
                  opacity: 0;
                  transform: translateY(20px);
                }
                to {
                  opacity: 1;
                  transform: translateY(0);
                }
              }

              .fade-in {
                animation: fadeIn 1.5s ease-out forwards;
              }

              .golden-gradient {
                background: radial-gradient(
                  ellipse at center,
                  rgba(212, 175, 55, 0.15) 0%,
                  rgba(212, 175, 55, 0.05) 40%,
                  transparent 70%
                );
              }

              .btn {
                width: 100%;
                padding: 1rem 2rem;
                border-radius: 9999px;
                font-family: 'Inter', sans-serif;
                font-weight: 300;
                letter-spacing: 0.25em;
                text-transform: uppercase;
                transition: all 0.3s ease;
              }

              .btn-skip {
                border: 1px solid rgba(217, 176, 69, 0.3);
                color: rgba(217, 176, 69, 0.85);
                background: transparent;
              }

              .btn-skip:hover {
                border-color: rgba(217, 176, 69, 0.6);
                background: rgba(217, 176, 69, 0.05);
              }

              .btn-next {
                border: none;
                background: linear-gradient(90deg, #d97706, #f59e0b, #d97706);
                color: #111;
                font-weight: 500;
              }

              .btn-next:hover {
                box-shadow: 0 20px 45px rgba(217, 119, 6, 0.3);
              }

              .corner {
                position: absolute;
                width: 4rem;
                height: 4rem;
                border-color: rgba(217, 176, 69, 0.1);
              }

              .corner.tl {
                top: 2rem;
                left: 2rem;
                border-top: 1px solid;
                border-left: 1px solid;
              }

              .corner.tr {
                top: 2rem;
                right: 2rem;
                border-top: 1px solid;
                border-right: 1px solid;
              }

              .corner.bl {
                bottom: 2rem;
                left: 2rem;
                border-bottom: 1px solid;
                border-left: 1px solid;
              }

              .corner.br {
                bottom: 2rem;
                right: 2rem;
                border-bottom: 1px solid;
                border-right: 1px solid;
              }

              .layout {
                width: 100%;
                height: 100vh;
                background-color: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                position: relative;
              }

              .content {
                text-align: center;
                position: relative;
                z-index: 10;
                padding: 0 2rem;
                transition: opacity 1.5s ease-out;
              }

              .divider {
                margin-top: 4rem;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.75rem;
              }

              .divider-line {
                width: 3rem;
                height: 1px;
                background: linear-gradient(
                  to right,
                  transparent,
                  rgba(217, 176, 69, 0.5),
                  transparent
                );
              }

              .divider-dot {
                width: 0.375rem;
                height: 0.375rem;
                border-radius: 9999px;
                background: rgba(217, 176, 69, 0.5);
              }

              .statue-wrapper {
                width: 10rem;
                height: 10rem;
                margin: 0 auto;
                position: relative;
              }

              .statue-glow {
                position: absolute;
                inset: 0;
                border-radius: 9999px;
                background: linear-gradient(
                  135deg,
                  rgba(217, 119, 6, 0.2),
                  rgba(217, 119, 6, 0.1),
                  transparent
                );
                filter: blur(40px);
              }

              .statue-core {
                position: absolute;
                inset: 0;
                border-radius: 9999px;
                background: linear-gradient(135deg, #d97706, #f59e0b, #b45309);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 30px 60px rgba(217, 119, 6, 0.3);
              }

              .statue-svg {
                width: 6rem;
                height: 8rem;
                color: rgba(0, 0, 0, 0.3);
              }

              .title {
                font-size: clamp(3rem, 8vw, 6rem);
                color: transparent;
                font-family: 'Cormorant Garamond', serif;
                font-weight: 300;
                letter-spacing: 0.15em;
                margin-bottom: 0.25em;
              }

              .subtitle {
                font-size: 0.75rem;
                font-family: 'Inter', sans-serif;
                font-weight: 300;
                color: rgba(217, 176, 69, 0.8);
                letter-spacing: 0.3em;
              }

              .section-title {
                margin-top: 4rem;
                font-size: clamp(1.75rem, 4vw, 2.5rem);
                font-family: 'Cormorant Garamond', serif;
                font-weight: 300;
                color: #f59e0b;
                letter-spacing: 0.1em;
              }

              .section-description {
                color: rgba(229, 231, 235, 0.8);
                font-size: clamp(0.85rem, 2vw, 1rem);
                font-family: 'Inter', sans-serif;
                font-weight: 300;
                max-width: 28rem;
                margin: 0 auto;
                line-height: 1.75;
                letter-spacing: 0.2em;
              }

              .actions {
                margin-top: 5rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                max-width: 18rem;
                margin-left: auto;
                margin-right: auto;
              }

              .background-glow {
                position: absolute;
                inset: 0;
                background: radial-gradient(
                  ellipse at center,
                  rgba(212, 175, 55, 0.15) 0%,
                  rgba(212, 175, 55, 0.05) 40%,
                  transparent 70%
                );
                animation: glow 3s ease-in-out infinite;
              }

              @media (max-width: 768px) {
                .content {
                  padding: 0 1.5rem;
                }

                .actions {
                  max-width: 14rem;
                }
              }
            `}</style>

            <div className="background-glow"></div>
            <div
              className="content"
              style={{ opacity, transition: 'opacity 1.5s ease-out' }}
            >
              <div className="fade-in" style={{ animationDelay: '0.3s' }}>
                <div className="statue-wrapper">
                  <div className="statue-glow glow-effect"></div>
                  <div className="statue-core">
                    <svg
                      viewBox="0 0 100 140"
                      className="statue-svg"
                      fill="currentColor"
                      aria-hidden="true"
                    >
                      <ellipse cx="50" cy="25" rx="12" ry="15" />
                      <path d="M 50 40 Q 30 60 25 120 L 35 120 L 40 70 Q 50 60 60 70 L 65 120 L 75 120 Q 70 60 50 40 Z" />
                      <rect x="35" y="120" width="30" height="8" rx="2" />
                    </svg>
                  </div>
                </div>
              </div>

              <div className="fade-in" style={{ animationDelay: '0.6s' }}>
                <h1 className="title shimmer-text">NICHE</h1>
              </div>

              <div className="fade-in" style={{ animationDelay: '0.9s' }}>
                <p className="subtitle">LUXURY LIFESTYLE MAGAZINE</p>
              </div>

              <div className="divider fade-in" style={{ animationDelay: '1.2s' }}>
                <div className="divider-line"></div>
                <div className="divider-dot"></div>
                <div className="divider-line"></div>
              </div>

              <div className="fade-in" style={{ animationDelay: '1.5s' }}>
                <h2 className="section-title">Curated Luxury Stories</h2>
                <p className="section-description">
                  Handpicked content from the world of luxury life style
                </p>
              </div>

              <div className="actions fade-in" style={{ animationDelay: '1.8s' }}>
                <button className="btn btn-skip">Skip</button>
                <button className="btn btn-next">Next</button>
              </div>
            </div>

            <div className="corner tl"></div>
            <div className="corner tr"></div>
            <div className="corner bl"></div>
            <div className="corner br"></div>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<NicheMagazineSplash />);
    </script>
  </body>
</html>
